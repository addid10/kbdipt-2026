{% load static %}
<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="KBDIpt - Sistem peringatan dini kebakaran lahan gambut">
    <title>{{ title }}</title>
    <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
    <link rel="icon" href="{% static 'icons/kbdipt.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'css/public.css' %}">
</head>
<body class="public-body">
    <main class="public-app">
        {% if messages %}<div class="public-message-stack global">{% for message in messages %}<div class="public-message {{ message.tags }}">{{ message }}</div>{% endfor %}</div>{% endif %}
        {% block content %}{% endblock %}
    </main>
    {% include 'public/partials/bottom_nav.html' %}
    <script src="{% static 'js/public.js' %}"></script>
</body>
</html>
